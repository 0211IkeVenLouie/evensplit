# Render Blueprint — one click creates the database and the web service.
#
#   render.com -> New -> Blueprint -> pick this repository -> Apply
#
# Nothing else to configure: DATABASE_URL is wired from the database below,
# migrations run on boot, and the demo data seeds itself.
databases:
  - name: evensplit-db
    databaseName: evensplit
    user: evensplit
    plan: free

services:
  - type: web
    name: evensplit
    runtime: docker        # older Render schemas call this key `env`
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: evensplit-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
