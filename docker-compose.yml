# docker compose up  ->  http://localhost:3000 with a seeded demo group.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evensplit
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/evensplit
      PORT: '3000'
      # container log instead of sent, so the demo works with no credentials.
    ports: ['3000:3000']
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
